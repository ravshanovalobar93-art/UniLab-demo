V.neweq=()=>isA()?`<h2>Yangi uskuna qo‘shish</h2><div class=card><div class=g2><label>Uskuna nomi<input id=xn></label><label>Modeli<input id=xm></label><label>Xona<input id=xr placeholder="masalan, 1.01"></label><label>Soni<input id=xk type=number min=1 value=1></label><label>Holati<select id=xs>${['Ishlaydi','Kalibrovkada','Ta’mirda','Yo‘q'].map(x=>`<option>${x}</option>`).join('')}</select></label></div><h4>Qaysi tahlillar uchun shart (ixtiyoriy)</h4><p class=mu style="margin:0 0 8px;font-size:13px">Tanlangan tahlillar bu uskuna «Ishlaydi» holatida bo‘lmaguncha boshlanmaydi. Ro‘yxatdagi «Yo‘q» uskunalar (Kjeldahl, Soxhlet, GC/MS) uchun yangisini qo‘shmang — Uskunalar jadvalida holatini «Ishlaydi» ga o‘zgartiring.</p><div class=g2>${IL()}</div><p id=er class=er></p><button class="gl btn" onclick=addEq()>Uskunani saqlash</button> <button class=lk onclick="nav('eq')">Bekor qilish</button></div>`:NA;
V.newrg=()=>isA()?`<h2>Yangi reagent qo‘shish</h2><div class=card><div class=g2><label>Reagent nomi<input id=gn></label><label>Miqdori<input id=gq type=number step=any min=0></label><label>Birlik<select id=gu>${['L','ml','kg','g','mg'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Yaroqlilik muddati<input id=ge type=date value=${D(365)}></label><label>Minimal qoldiq (ogohlantirish chegarasi)<input id=gm type=number step=any min=0 value=0></label></div><h4>Qaysi tahlillarda ishlatiladi (ixtiyoriy)</h4><div class=g2>${IL()}</div><p id=er class=er></p><button class="gl btn" onclick=addRg()>Reagentni saqlash</button> <button class=lk onclick="nav('rg')">Bekor qilish</button></div>`:NA;
function addEq(){if(!isA())return;const n=$('#xn').value.trim(),k=+$('#xk').value,er=!n?'Uskuna nomini kiriting.':!(k>=1)?'Sonini kiriting (kamida 1).':'';
if(er)return $('#er').textContent=er;
S.eq.push({id:'x'+Date.now(),n,m:$('#xm').value.trim()||'—',x:$('#xr').value.trim()||'—',k,st:$('#xs').value,ind:sel(),c:1});save();nav('eq')}
function addRg(){if(!isA())return;const n=$('#gn').value.trim(),qv=$('#gq').value,e=$('#ge').value,er=!n?'Reagent nomini kiriting.':qv===''||+qv<0?'Miqdorni kiriting (0 yoki undan katta).':!e?'Yaroqlilik muddatini tanlang.':'';
if(er)return $('#er').textContent=er;
S.rg.push({id:Math.max(0,...S.rg.map(r=>r.id))+1,n,q:+qv,u:$('#gu').value,e,m:+$('#gm').value||0,ind:sel(),c:1});save();nav('rg')}
function del(b,k,id){if(!isA())return;if(!b.dataset.s){b.dataset.s=1;b.textContent='Aniq o‘chirilsinmi?';setTimeout(()=>{b.textContent='O‘chirish';delete b.dataset.s},3000);return}S[k]=S[k].filter(x=>x.id!=id);save();render()}
function render(){const A=$('#app');
if(!U){A.innerHTML=`<div class=lw>${thb()}</div><div class="card lg"><div class=br style="font-size:24px">${FL}<span><b class=gt>UniLab</b><small>Universitet oziq-ovqat laboratoriyasi — yopiq tizim</small></span></div><label>Login<input id=lg autocomplete=username></label><label>Parol<input id=pw type=password onkeydown="if(event.key=='Enter')login()"></label><p id=er class=er></p><button class="gl btn" onclick=login()>Kirish</button><p class=mu style="font-size:12px">Demo: admin / admin123 · xodim / xodim123 · rahbar / rahbar123</p></div>`;return}
const tb=[['dash','Boshqaruv paneli'],['sm','Namunalar'],['eq','Uskunalar'],['rg','Reagentlar']],ac=['det','new','rep'].includes(view)?'sm':view=='neweq'?'eq':view=='newrg'?'rg':view;
A.innerHTML=`<div class="shell${sb?' o':''}" id=sh><aside class="side np"><div class=br><button class="gl ic fb" onclick="sbt()" title="Yon panelni ochish / yopish" aria-label="Yon panelni ochish / yopish">${FL}</button><span class=t><b class=gt>UniLab</b><small>Oziq-ovqat laboratoriyasi</small></span></div><nav>${tb.map(t=>`<button class="gl nv${t[0]==ac?' on':''}" onclick="go('${t[0]}')" title="${t[1]}"><i>${IC[t[0]]}</i><span class=t>${t[1]}</span></button>`).join('')}</nav></aside><div class="scrim np" onclick="sbt()"></div><div class=mw><header class=np><button class="gl ic mf" onclick="sbt()" aria-label="Yon panelni ochish / yopish">${FL.replace(/gg/g,'gm')}</button><span class=sp></span>${thb()}${pf()}</header><main>${V[view]()}</main></div></div>`}
render();
</script></body></html>
